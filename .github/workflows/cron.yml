name: Cron Jobs

on:
  schedule:
    # Email weekly cron - runs daily at 13:00 UTC (matches Vercel schedule: "0 13 * * *")
    - cron: '0 13 * * 1'
    # Discord weekly cron - runs every Monday at 13:00 UTC (matches Vercel schedule: "0 13 * * 1")
    - cron: '1 13 * * 1'
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  email-weekly:
    name: Email Weekly Digest
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 13 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call Email Weekly Endpoint
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VERCEL_URL" ]; then
            echo "Error: VERCEL_URL secret is not set"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is not set"
            exit 1
          fi
          
          echo "Calling email weekly endpoint..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/cron/email-weekly")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response HTTP Status: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✓ Email weekly cron completed successfully"
          else
            echo "✗ Email weekly cron failed with HTTP $http_code"
            exit 1
          fi

  discord-weekly:
    name: Discord Weekly Summary
    runs-on: ubuntu-latest
    if: github.event.schedule == '1 13 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call Discord Weekly Endpoint
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VERCEL_URL" ]; then
            echo "Error: VERCEL_URL secret is not set"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is not set"
            exit 1
          fi
          
          echo "Calling Discord weekly endpoint..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/cron/discord-weekly")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response HTTP Status: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✓ Discord weekly cron completed successfully"
          else
            echo "✗ Discord weekly cron failed with HTTP $http_code"
            exit 1
          fi
