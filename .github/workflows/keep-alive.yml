name: Keep Alive

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep Database Alive
    runs-on: ubuntu-latest
    steps:
      - name: Call Keep-Alive Endpoint
        env:
          VERCEL_URL: ${{ vars.VERCEL_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$VERCEL_URL" ]; then
            echo "Error: VERCEL_URL variable is not set"
            exit 1
          fi
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "Error: ADMIN_API_KEY secret is not set"
            exit 1
          fi

          echo "Calling keep-alive endpoint..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$VERCEL_URL/api/cron/keep-alive")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response HTTP Status: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✓ Keep-alive completed successfully"
          else
            echo "✗ Keep-alive failed with HTTP $http_code"
            exit 1
          fi
